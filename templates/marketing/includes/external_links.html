{% if links %}
    <div class="row g-3 mt-3">
        {% for link in links %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h3 class="h5 card-title">
                            <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}</a>
                        </h3>
                        {% if link.description %}
                            <p class="card-text text-muted small mb-0">{{ link.description }}</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}
