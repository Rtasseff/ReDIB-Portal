{% load wagtailcore_tags %}
<span class="mk-lang" aria-label="Idioma / Language">
    {% for entry in entries %}
        {% if entry.code == current_code %}
            <a class="is-active" aria-current="true">{{ entry.code|upper }}</a>
        {% else %}
            <a href="{% pageurl entry.page %}"
               {% if entry.is_fallback %}title="No translation available — link goes to the {{ entry.code|upper }} home"{% endif %}>{{ entry.code|upper }}</a>
        {% endif %}
    {% endfor %}
</span>
