{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{% static 'images/logo-placeholder.svg' %}" alt="ReDIB">
            <h2>ReDIB Portal</h2>
            <p>Competitive Open Access Management</p>
        </div>
        <div class="card">
            <div class="card-body">
                {% block entrance_content %}{% endblock %}
            </div>
        </div>
        <div class="auth-footer">
            {% block entrance_footer %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
