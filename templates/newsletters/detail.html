{% extends 'base.html' %}

{% block title %}{{ newsletter.title }} - ReDIB Newsletter{% endblock %}

{% block extra_css %}
<style>
    .newsletter-frame {
        width: 100%;
        min-height: 80vh;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        background: #fff;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3">
        <div>
            <div class="text-muted small mb-1">
                <a href="{% url 'newsletters:list' %}" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> All newsletters
                </a>
                <span class="mx-2">·</span>
                <i class="bi bi-calendar3"></i> {{ newsletter.publish_date|date:"F j, Y" }}
            </div>
            <h1 class="mb-0">{{ newsletter.title }}</h1>
        </div>
        <a href="{% url 'calls:public_list' %}" class="btn btn-outline-primary mt-2">
            <i class="bi bi-megaphone"></i> Browse Open Calls
        </a>
    </div>

    <iframe class="newsletter-frame"
            src="{% url 'newsletters:raw' newsletter.slug %}"
            title="{{ newsletter.title }}"
            loading="lazy"></iframe>
</div>
{% endblock %}
